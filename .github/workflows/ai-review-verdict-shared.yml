name: ai-review (shared)

# The commit STATUS "ai-review/verdict" for every petralabx repo but the portal (TASK-3902). Each repo calls
# this file from a short .github/workflows/ai-review-verdict.yml that pins it to PLX_MC main, so a PR cannot
# change the rule that grades it. The rule is the portal's ai-review-verdict.yml, copied with three changes:
# the base branch comes from the caller, the definition check reads the caller's file, and trust_org_members
# also trusts petralabx members' markers on PRs they did not open (Vince, 2026-10-25).
# Passes when at least min_reviewers (default 1) reviewers from approved_reviewers (default "sol-6.1,astra,claude")
# have a clean trusted marker for the PR's CURRENT head SHA: files_read > 0, no open P0/P1, no error.
# The PR author's own family (from the commits' "Agent:" trailers, e.g. claude/* or claude-code/* -> claude,
# codex/* or sol* -> sol-6.1, astra/* -> astra) does not count toward the pass; if no family can be determined
# nothing is excluded. A blocking (P0/P1) or errored marker from ANY reviewer on the head fails, approved or not.
# Several markers for the same SHA and reviewer: the worst wins (max open_p0/open_p1; any error fails).
# Marker (PR comment, review body or PR description):
#   <!-- ai-review {"reviewer":"astra","sha":"<40-char head sha>","open_p0":0,"open_p1":0,"files_read":3} -->
# Every trigger recomputes the verdict for every open PR on the base branch and posts the status on its head.
# No checkout of PR code; the caller's GITHUB_TOKEN needs statuses: write, pull-requests: read, issues: read
# and contents: read. A pull_request_review run comes from the PR's merge ref, so it posts nothing unless that
# copy of the caller file is the base branch's. merge_group runs grade the queued PRs and post on the group's
# merge commit; the backstop job posts failure if grading did not finish.

on:
  workflow_call:
    inputs:
      base_branch:
        description: The branch PRs target, for example main.
        type: string
        required: true
      caller_path:
        description: The caller workflow file in the calling repo.
        type: string
        default: .github/workflows/ai-review-verdict.yml
      approved_reviewers:
        description: Reviewers whose clean marker can pass the gate (comma list, case-insensitive).
        type: string
        default: sol-6.1,astra,claude
      min_reviewers:
        description: How many distinct approved reviewers outside the PR author's family must be clean.
        type: number
        default: 1
      trust_org_members:
        description: Also trust markers from petralabx members (OWNER or MEMBER) other than the PR's author.
        type: boolean
        default: false

jobs:
  verdict:
    name: ai-review-status
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    timeout-minutes: 15 # merge_group: a hung run ends, and merge-group-backstop then posts failure
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ inputs.base_branch }}
      CALLER_PATH: ${{ inputs.caller_path }}
      # Reviewers whose clean marker on the current head can pass the gate (comma list, case-insensitive).
      APPROVED_REVIEWERS: ${{ inputs.approved_reviewers }}
      # How many distinct approved reviewers (outside the PR author's family) must be clean.
      MIN_REVIEWERS: ${{ inputs.min_reviewers }}
      TRUST_ORG_MEMBERS: ${{ inputs.trust_org_members }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // Trusted marker posters. The plx-agents GitHub App (Astra's posting identity), matched by exact login
            // (case-sensitive) AND user.type 'Bot' (integrity fix #2116). With trust_org_members (Vince, 2026-10-25,
            // TASK-3902), also a petralabx organization member (a User whose author_association is OWNER or MEMBER),
            // but never the PR's author: nobody reviews their own PR, and agents open PRs under member accounts.
            // COLLABORATOR, CONTRIBUTOR and NONE never count, and neither does any other bot.
            const trustedBot = 'plx-agents[bot]';
            const trustOrgMembers = String(process.env.TRUST_ORG_MEMBERS || '').trim().toLowerCase() === 'true';
            const memberAssoc = new Set(['OWNER', 'MEMBER']);
            // The repo's base branch (the caller passes it) and the caller file whose definition a run must match.
            const baseBranch = String(process.env.BASE_BRANCH || '').trim();
            if (!baseBranch) { core.setFailed('BASE_BRANCH is required (the caller passes base_branch).'); return; }
            const callerPath = String(process.env.CALLER_PATH || '').trim() || '.github/workflows/ai-review-verdict.yml';
            const approved = new Set(String(process.env.APPROVED_REVIEWERS || 'sol-6.1,astra,claude').split(',').map(s => s.trim().toLowerCase()).filter(Boolean));
            const minReviewers = Math.max(1, parseInt(process.env.MIN_REVIEWERS || '1', 10) || 1);
            // Author family from a commit's "Agent:" trailer (first path segment). Unknown agents (cursor/*, humans) map to none.
            const familyOf = agent => {
              const a = String(agent || '').trim().toLowerCase();
              if (/^claude([\/-]|$)/.test(a)) return 'claude'; // claude/*, claude-code/*, any claude-* runtime
              if (/^(codex|sol)([\/-]|$)/.test(a)) return 'sol-6.1';
              if (/^astra(\/|$)/.test(a)) return 'astra';
              return null;
            };
            // Every counted marker must carry integer files_read > 0 (changed files named in the review output, written by
            // ai-review-comment.sh), else it counts as an error. (The 2026-10-19 CUTOVER exemption for older bare markers is retired.)
            const provedRead = v => Number.isInteger(v.files_read) && v.files_read > 0;
            const re = /<!--\s*ai-review\s+(\{[\s\S]*?\})\s*-->/g;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // TASK-2933: a run whose definition comes from a PR merge ref (pull_request_review, or a
            // pull_request trigger if one is ever added back) posts nothing unless that copy of this file
            // is the base branch's: a stale or unmerged copy would re-score every open PR with its own rule.
            // The 30-minute sweep, a PR comment or a PR event (pull_request_target) recomputes instead.
            if (context.eventName === 'pull_request_review' || context.eventName === 'pull_request') {
              const path = callerPath;
              const blob = async ref => (await github.rest.repos.getContent({ owner, repo, path, ref })).data.sha;
              let own, base;
              try {
                [own, base] = await Promise.all([blob(process.env.GITHUB_WORKFLOW_SHA || context.sha), blob(baseBranch)]);
              } catch (e) {
                core.warning(`Could not compare this run's ${path} with ${baseBranch}'s (${e.message}); posting nothing.`);
                return;
              }
              if (own !== base) {
                core.notice(`This run's ${path} (blob ${own}) is not ${baseBranch}'s (blob ${base}); posting nothing.`);
                return;
              }
            }

            // Every run recomputes ALL open PRs on the base branch (the event's PR first): with one global concurrency
            // group a queued run can be replaced by another PR's event, so no run may handle only its own PR.
            const eventPr = context.payload.issue?.number || context.payload.pull_request?.number;
            let prs;
            try {
              prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: baseBranch, per_page: 100 });
            } catch (e) {
              // merge_group: the required status must still be posted, or the group waits for the queue timeout.
              if (context.eventName !== 'merge_group') throw e;
              await github.rest.repos.createCommitStatus({ owner, repo, sha: context.payload.merge_group.head_sha, state: 'failure',
                context: 'ai-review/verdict', description: `Could not list open PRs for the merge group: ${e.message}`.slice(0, 140), target_url: runUrl });
              core.setFailed(`ai-review merge_group: could not list open PRs: ${e.message}`);
              return;
            }
            prs.sort((a, b) => (b.number === eventPr) - (a.number === eventPr));

            const isTrustedBot = u => u?.login === trustedBot && u?.type === 'Bot';
            const isTrusted = (t, pr) => isTrustedBot({ login: t.login, type: t.type }) ||
              (trustOrgMembers && t.type === 'User' && memberAssoc.has(String(t.assoc || '').toUpperCase()) &&
               Boolean(t.login) && t.login !== pr.user?.login);

            // Statuses live on the SHA, not the PR: two open PRs with the same head would overwrite each other's
            // ai-review/verdict. Such heads get one fixed failure naming every PR, so no PR can inherit another's pass.
            const headPrs = new Map();
            for (const p of prs) { const l = headPrs.get(p.head.sha) || []; l.push(p.number); headPrs.set(p.head.sha, l); }

            // Edited markers: the REST author is the text's ORIGINAL author, so a marker edited later (e.g. by the PR
            // author or another member) could pass. Read lastEditedAt/editor (GraphQL) for every trusted text that holds
            // a marker; an edit counts only when the editor is the trusted bot, or the same trusted non-author member who
            // wrote it. Anything else (unknown editor, editor = PR author) drops the marker. A failed lookup throws, and
            // the PR gets an error status (fail closed).
            const trustedEditorLogin = trustedBot.replace(/\[bot\]$/, '');
            async function editedBadSet(items, pr) {
              const bad = new Set();
              const byId = new Map(items.map(t => [t.node, t]));
              const nodeIds = [...byId.keys()];
              for (let i = 0; i < nodeIds.length; i += 50) {
                const ids = nodeIds.slice(i, i + 50);
                const q = `query($ids:[ID!]!){nodes(ids:$ids){id ... on Comment{lastEditedAt editor{login __typename}}}}`;
                const res = await github.graphql(q, { ids });
                if ((res.nodes || []).length !== ids.length) throw new Error('edit-history lookup returned fewer nodes than asked');
                for (const n of res.nodes || []) {
                  if (!n || !n.lastEditedAt) continue;
                  const t = byId.get(n.id);
                  const ed = n.editor;
                  const botEdit = ed && ed.__typename === 'Bot' && ed.login === trustedEditorLogin;
                  const selfEdit = ed && ed.__typename === 'User' && t && t.type === 'User' && ed.login === t.login && ed.login !== pr.user?.login;
                  if (!botEdit && !selfEdit) bad.add(n.id);
                }
              }
              return bad;
            }

            async function verdict(pr, collect = false) {
              const sha = pr.head.sha;
              const texts = [];
              if (pr.body) texts.push({ node: pr.node_id, body: pr.body, at: null, assoc: pr.author_association, login: pr.user?.login, type: pr.user?.type });
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              for (const c of comments) texts.push({ node: c.node_id, edited: Boolean(c.updated_at && c.created_at && c.updated_at !== c.created_at), body: c.body || '', at: c.updated_at || c.created_at, assoc: c.author_association, login: c.user?.login, type: c.user?.type });
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number, per_page: 100 });
              for (const r of reviews) if (r.state !== 'DISMISSED') texts.push({ node: r.node_id, body: r.body || '', at: r.submitted_at, assoc: r.author_association, login: r.user?.login, type: r.user?.type });
              const agg = {};
              const markerRe = /<!--\s*ai-review\s/;
              const editedBad = await editedBadSet(texts.filter(t => t.node && isTrusted(t, pr) && markerRe.test(t.body)), pr);
              for (const t of texts) {
                if (!isTrusted(t, pr)) continue;
                if (t.node ? editedBad.has(t.node) : t.edited) { core.warning(`#${pr.number}: marker text ${t.node || '(no node id)'} was edited by someone other than its trusted author or ${trustedBot}; ignored`); continue; }
                for (const m of t.body.matchAll(re)) {
                  let v; try { v = JSON.parse(m[1]); } catch { continue; }
                  const who = String(v.reviewer || '').toLowerCase();
                  if (!who || v.sha !== sha) continue;
                  // Worst marker wins; a malformed count is treated as 1 (fail-safe); error is sticky.
                  const n = k => (typeof v[k] === 'number' && Number.isInteger(v[k]) && v[k] >= 0) ? v[k] : 1;
                  // A bare marker (no integer files_read > 0) did not prove a diff read: error, regardless of date
                  // (files_read is required of approved reviewers; another reviewer's marker is only read for P0/P1/error.)
                  const err = v.error === true || String(v.verdict || '').toLowerCase() === 'error' || (approved.has(who) && !provedRead(v));
                  const p = agg[who] || { open_p0: 0, open_p1: 0, error: false, markers: 0 };
                  agg[who] = { open_p0: Math.max(p.open_p0, n('open_p0')), open_p1: Math.max(p.open_p1, n('open_p1')),
                               error: p.error || err, markers: p.markers + 1 };
                }
              }
              const got = Object.keys(agg);
              let state = 'success', desc;
              const errored = got.filter(w => agg[w].error);
              const blocking = got.filter(w => agg[w].open_p0 > 0 || agg[w].open_p1 > 0);
              const own = new Set();
              let commitsTruncated = false;
              if (got.length) {
                // pulls.listCommits stops at 250 commits even when paginated. At 250+ use the compare API (paged, reports
                // total_commits); if it still returns fewer than total_commits, fail closed (a family could be missed).
                let commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: pr.number, per_page: 100 });
                if (commits.length >= 250) {
                  commits = []; let total = Infinity;
                  for (let page = 1; commits.length < total && page <= 100; page++) {
                    const d = (await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${pr.base.sha}...${sha}`, per_page: 100, page })).data;
                    total = d.total_commits; if (!d.commits?.length) break; commits.push(...d.commits);
                  }
                  commitsTruncated = !(commits.length >= total);
                }
                for (const cm of commits) for (const m of String(cm.commit?.message || '').matchAll(/^Agent:[ \t]*(\S+)/gmi)) { const f = familyOf(m[1]); if (f) own.add(f); }
              }
              const counted = got.filter(w => approved.has(w) && !own.has(w) && !agg[w].error && !agg[w].open_p0 && !agg[w].open_p1);
              const ownNote = own.size ? ` (author family ${[...own].join(', ')} not counted)` : '';
              if (commitsTruncated) { state = 'failure'; desc = `Could not read every commit of the PR to find the author family on ${sha.slice(0, 7)} (fail closed)`; }
              else if (errored.length) { state = 'failure'; desc = `Errored or unproven review (counts as fail): ${errored.join(', ')}`; }
              else if (blocking.length) { state = 'failure'; desc = 'Open ' + blocking.map(w => `${w} P0=${agg[w].open_p0} P1=${agg[w].open_p1}`).join('; '); }
              else if (counted.length < minReviewers) { state = 'pending'; desc = `Need ${minReviewers} clean approved review on ${sha.slice(0, 7)}, have ${counted.length}${ownNote}`; }
              else desc = `Clean: ${counted.join(', ')} on ${sha.slice(0, 7)} (no open P0/P1)${ownNote}`;
              // Head moved while computing: skip; the push's own run (or the next sweep) covers the new head.
              const now = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
              if (now.head.sha !== sha) { core.info(`#${pr.number}: head moved ${sha} -> ${now.head.sha}; skipped`); return; }
              if (collect) return { state, desc, sha }; // merge_group: graded, not posted on the PR head
              const sharers = headPrs.get(sha) || [];
              if (sharers.length > 1) {
                state = 'failure';
                desc = `Head ${sha.slice(0, 7)} is shared by open PRs ${sharers.map(n => '#' + n).join(', ')}; the status cannot be scoped per PR. Close the duplicates.`;
              }
              const description = desc.slice(0, 140);
              // Post only on change (statuses are capped at 1000 per SHA per context; newest first).
              const existing = (await github.rest.repos.listCommitStatusesForRef({ owner, repo, ref: sha, per_page: 100 })).data
                .find(x => x.context === 'ai-review/verdict');
              if (existing && existing.state === state && existing.description === description) {
                core.info(`#${pr.number} ${sha} unchanged (${state}); not reposted`);
              } else {
                await github.rest.repos.createCommitStatus({ owner, repo, sha, state, context: 'ai-review/verdict', description, target_url: runUrl });
              }
              core.summary.addHeading(`#${pr.number} ${state}`, 3).addRaw(`Head ${sha}: ${desc}\n\n`).addCodeBlock(JSON.stringify(agg, null, 2), 'json');
              core.info(`#${pr.number} ${sha} ${state}: ${desc}`);
            }

            // Merge queue: grade every PR in the queued group with the same rule as above and post ONE status on the
            // group's merge commit. Every path posts (success or failure) so the required context never goes missing;
            // anything short of success (pending, failure, error, unresolved PR) is failure, which ejects the group.
            if (context.eventName === 'merge_group') {
              const mg = context.payload.merge_group || {};
              const mgSha = mg.head_sha;
              const mgPost = async (state, d) => {
                await github.rest.repos.createCommitStatus({ owner, repo, sha: mgSha, state, context: 'ai-review/verdict',
                  description: d.slice(0, 140), target_url: runUrl });
                core.summary.addHeading(`merge_group ${state}`, 3).addRaw(`${mgSha}: ${d}\n\n`);
                core.info(`merge_group ${mgSha} ${state}: ${d}`);
              };
              try {
                // This run's definition comes from the queued commit. A group that edits this file must not grade itself.
                const path = callerPath;
                const blob = async ref => (await github.rest.repos.getContent({ owner, repo, path, ref })).data.sha;
                const [own, base] = await Promise.all([blob(process.env.GITHUB_WORKFLOW_SHA || mgSha), blob(mg.base_ref || baseBranch)]);
                if (own !== base) {
                  await mgPost('failure', `Group changes ${path}; it cannot grade itself. Land it outside the queue (Vince).`);
                } else {
                  // Queue membership (same algorithm as scripts/merge-group-members.mjs, inlined because this run must
                  // not execute code from the queued commit): queue ref PR N + the PAGINATED base_sha...head_sha commits,
                  // walking the first-parent chain of queue merge commits; parents[1] of each is one member's head,
                  // mapped with commits/{sha}/pulls to an open PR on the base whose head is exactly that sha. Unqueued
                  // ancestor PRs are reachable but never a chain merge parent, so they are excluded. Anything else throws.
                  const get = async p => (await github.request(`GET ${p}`)).data;
                  const qm = String(mg.head_ref || '').match(/^(?:refs\/heads\/)?gh-readonly-queue\/(.+)\/pr-(\d+)-[0-9a-f]{40}$/);
                  if (!qm) throw new Error(`not a merge queue ref: ${mg.head_ref || '(none)'}`);
                  const qBase = String(mg.base_ref || qm[1]).replace(/^refs\/heads\//, '');
                  if (qBase !== qm[1]) throw new Error(`queue ref base ${qm[1]} != base_ref ${qBase}`);
                  const commits = new Map();
                  let total = null;
                  for (let page = 1; page <= 100; page++) {
                    const cmp = await get(`/repos/${owner}/${repo}/compare/${mg.base_sha}...${mgSha}?per_page=100&page=${page}`);
                    if (total === null) total = Number(cmp.total_commits);
                    for (const x of cmp.commits || []) commits.set(x.sha, x);
                    if (commits.size >= total || !(cmp.commits || []).length) break;
                  }
                  if (!Number.isFinite(total) || commits.size !== total) throw new Error(`comparison incomplete: ${commits.size}/${total} commits`);
                  const members = [];
                  for (let sha = mgSha, seen = new Set(); sha !== mg.base_sha;) {
                    const c = commits.get(sha);
                    if (!c || seen.has(sha)) throw new Error(`first-parent chain left the group at ${sha.slice(0, 7)}`);
                    seen.add(sha);
                    const parents = (c.parents || []).map(x => x.sha);
                    if (parents.length !== 2) throw new Error(`queue commit ${sha.slice(0, 7)} is not a merge commit (queue must use the merge-commit method)`);
                    // Open, or already merged into the base (a predecessor that landed after the group was built).
                    const hit = ((await get(`/repos/${owner}/${repo}/commits/${parents[1]}/pulls?per_page=100`)) || [])
                      .filter(x => (x.state === 'open' || x.merged_at) && x.base?.ref === qBase && x.head?.sha === parents[1]);
                    if (hit.length !== 1) throw new Error(`queue commit ${sha.slice(0, 7)}: ${hit.length} open or merged ${qBase} PRs with head ${parents[1].slice(0, 7)}`);
                    members.push({ number: hit[0].number, head_sha: parents[1], merged: Boolean(hit[0].merged_at) });
                    sha = parents[0];
                  }
                  if (!members.length) throw new Error('empty merge group');
                  if (members[0].number !== Number(qm[2])) throw new Error(`head commit merges #${members[0].number}, queue ref names #${qm[2]}`);
                  if (members[0].merged) throw new Error(`queue-ref PR #${qm[2]} is already merged`);
                  members.reverse();
                  {
                    const bad = [], ok = [];
                    for (const mem of members) {
                      // A merged predecessor already passed this gate in its own queue entry; it is landed code.
                      if (mem.merged) { ok.push(`#${mem.number} (merged)`); continue; }
                      const pr = prs.find(x => x.number === mem.number);
                      if (!pr) { bad.push(`#${mem.number} not an open ${baseBranch} PR`); continue; }
                      if (pr.head.sha !== mem.head_sha) { bad.push(`#${mem.number} head moved`); continue; }
                      const r = await verdict(pr, true);
                      if (!r) bad.push(`#${mem.number} head moved`);
                      else if (r.state !== 'success') bad.push(`#${mem.number} ${r.desc}`);
                      else ok.push(`#${mem.number}`);
                    }
                    if (bad.length) await mgPost('failure', `Queue: ${bad.join('; ')}`);
                    else await mgPost('success', `Queue: clean ${ok.join(', ')}`);
                  }
                }
              } catch (e) {
                core.error(e.stack || e.message);
                try { await mgPost('failure', `Verdict could not be computed for the merge group: ${e.message}`); }
                catch (e2) { core.error(`could not post merge_group status: ${e2.message}`); }
                await core.summary.write();
                core.setFailed(`ai-review merge_group verdict failed: ${e.message}`);
                return;
              }
              await core.summary.write();
              return;
            }

            const errors = [];
            for (const pr of prs) {
              if (pr.base.ref !== baseBranch || pr.state !== 'open') continue;
              try { await verdict(pr); }
              catch (e) {
                errors.push(`#${pr.number}: ${e.message}`); core.error(`#${pr.number}: ${e.stack || e.message}`);
                // Best-effort: never leave a stale success on a head we could not evaluate.
                try {
                  await github.rest.repos.createCommitStatus({ owner, repo, sha: pr.head.sha, state: 'error', context: 'ai-review/verdict',
                    description: `Verdict could not be computed: ${e.message}`.slice(0, 140), target_url: runUrl });
                } catch (e2) { core.error(`#${pr.number}: could not post error status: ${e2.message}`); }
              }
            }
            await core.summary.write();
            if (errors.length) core.setFailed(`ai-review verdict failed for ${errors.length} PR(s): ${errors.join('; ')}`);

  # merge_group backstop: if ai-review-status did not finish with success (crash, timeout, cancellation, a skip
  # or any error path that could not post), post a terminal FAILURE on the queued commit so the group is ejected
  # promptly instead of waiting for the queue timeout. A success run already posted its own status.
  merge-group-backstop:
    name: ai-review-merge-group-backstop
    needs: verdict
    if: always() && github.event_name == 'merge_group' && needs.verdict.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          VERDICT_RESULT: ${{ needs.verdict.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.merge_group.head_sha;
            const result = process.env.VERDICT_RESULT;
            await github.rest.repos.createCommitStatus({ owner, repo, sha, state: 'failure', context: 'ai-review/verdict',
              description: `ai-review-status ended ${result}; merge group not graded`.slice(0, 140),
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}` });
            core.info(`merge_group ${sha}: backstop posted failure (ai-review-status ${result})`);
