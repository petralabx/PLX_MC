name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

jobs:
  test:
    name: Preflight + full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies (governance tooling)
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Policy gate (same command agents run locally)
        run: ./scripts/preflight.sh --mode ci

      - name: Full suite (same command as pre-push)
        run: ./scripts/preflight.sh --mode pre-push

  # Full 6-job Windows/Ubuntu matrix runs on push to main only (PR-drain 8).
  # PRs get the single lightweight job below. None of these are required checks.
  mcp-wrapper:
    name: MCP wrapper (${{ matrix.os }}, Node ${{ matrix.node }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # Supported lines: 22 (maintenance LTS) and 24 (active LTS, = .nvmrc),
        # plus "current" (26 at time of writing) to catch breakage early.
        # 20 is EOL. Keep in step with engines in tools/plx-mc-mcp/package.json.
        node: ["22", "24", "current"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/plx-mc-mcp/package-lock.json

      - name: Install wrapper dependencies
        working-directory: tools/plx-mc-mcp
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: ESM and CommonJS import check (offline)
        run: node tools/plx-mc-mcp/check-imports.mjs

      - name: Launcher smoke (offline handshake, placeholder key, no secrets)
        run: node tools/plx-mc-mcp/smoke-launch.mjs

  mcp-wrapper-pr:
    name: MCP wrapper (PR, ubuntu-latest, Node 24)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/plx-mc-mcp/package-lock.json

      - name: Install wrapper dependencies
        working-directory: tools/plx-mc-mcp
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: ESM and CommonJS import check (offline)
        run: node tools/plx-mc-mcp/check-imports.mjs

      - name: Launcher smoke (offline handshake, placeholder key, no secrets)
        run: node tools/plx-mc-mcp/smoke-launch.mjs

  # One roll-up check per repo (TASK-3902): the one org ruleset requires `ci` in
  # every repo instead of each repo's job names. It covers today's required job.
  ci:
    name: ci
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")' > /dev/null
