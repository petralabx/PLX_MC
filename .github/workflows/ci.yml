name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

# Each job runs one step of scripts/preflight.sh, the command agents run before
# they push, and the jobs run in parallel (TASK-4346). "Preflight + full suite"
# keeps its name and passes only when every one of them passes, so the
# required checks and the rulesets do not change.
jobs:
  policy:
    name: Policy, typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/plx-mc-setup
      - name: Policy gate (same command agents run locally)
        run: ./scripts/preflight.sh --mode ci

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/plx-mc-setup
      - name: Python tests (pre-push step)
        run: ./scripts/preflight.sh --only python-tests

  node-tests:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/plx-mc-setup
      - name: Node tests (pre-push step)
        run: ./scripts/preflight.sh --only node-tests

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/plx-mc-setup
      - name: Production build (pre-push step)
        run: ./scripts/preflight.sh --only build

  # Playwright ran 482 tests on one worker in about 20 minutes. Each shard
  # starts its own server, as the single run did, and runs a quarter of them.
  e2e:
    name: Playwright E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/plx-mc-setup
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright E2E shard (pre-push step)
        run: ./scripts/preflight.sh --only e2e -- --shard=${{ matrix.shard }}/4

  test:
    name: Preflight + full suite
    if: always()
    needs: [policy, python-tests, node-tests, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every full-suite job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; . == "success")' > /dev/null

  # Full 6-job Windows/Ubuntu matrix runs on push to main only (PR-drain 8).
  # PRs get the single lightweight job below. None of these are required checks.
  mcp-wrapper:
    name: MCP wrapper (${{ matrix.os }}, Node ${{ matrix.node }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # Supported lines: 22 (maintenance LTS) and 24 (active LTS, = .nvmrc),
        # plus "current" (26 at time of writing) to catch breakage early.
        # 20 is EOL. Keep in step with engines in tools/plx-mc-mcp/package.json.
        node: ["22", "24", "current"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/plx-mc-mcp/package-lock.json

      - name: Install wrapper dependencies
        working-directory: tools/plx-mc-mcp
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: ESM and CommonJS import check (offline)
        run: node tools/plx-mc-mcp/check-imports.mjs

      - name: Launcher smoke (offline handshake, placeholder key, no secrets)
        run: node tools/plx-mc-mcp/smoke-launch.mjs

  mcp-wrapper-pr:
    name: MCP wrapper (PR, ubuntu-latest, Node 24)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/plx-mc-mcp/package-lock.json

      - name: Install wrapper dependencies
        working-directory: tools/plx-mc-mcp
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: ESM and CommonJS import check (offline)
        run: node tools/plx-mc-mcp/check-imports.mjs

      - name: Launcher smoke (offline handshake, placeholder key, no secrets)
        run: node tools/plx-mc-mcp/smoke-launch.mjs

  # One roll-up check per repo (TASK-3902): the one org ruleset requires `ci` in
  # every repo instead of each repo's job names. It covers today's required job.
  ci:
    name: ci
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")' > /dev/null
