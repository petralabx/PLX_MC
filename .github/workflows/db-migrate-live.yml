name: DB Migrate (live release)

# Manual live plx_mc release. Plan is the default and changes nothing. Apply needs
# mode=apply, confirm=MIGRATE_LIVE and the mc-live-release environment approval.
# Uses its own MC_LIVE_* pair, separate from the automatic path; see docs/runbooks/db-migrate.md.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan lists and changes nothing; apply migrates then provisions SharePoint'
        type: choice
        required: true
        default: plan
        options: [plan, apply]
      confirm:
        description: 'Type MIGRATE_LIVE with mode=apply to run apply'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: db-migrate-plx-mc
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && !(inputs.mode == 'apply' && inputs.confirm == 'MIGRATE_LIVE')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Plan (read-only, prints redacted host and database only)
        env:
          MC_LIVE_DATABASE_URL: ${{ secrets.MC_LIVE_DATABASE_URL }}
        run: node scripts/db-migrate-live.mjs plan | tee -a "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'apply' && inputs.confirm == 'MIGRATE_LIVE'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mc-live-release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 -m pip install requests==2.32.5
      - name: Verify live identity before any write
        env:
          MC_LIVE_DATABASE_URL: ${{ secrets.MC_LIVE_DATABASE_URL }}
          MC_LIVE_APPROVED_DB: ${{ vars.MC_LIVE_APPROVED_DB }}
        run: node scripts/db-migrate-live.mjs verify
      - name: Migrate live database
        env:
          PLX_MC_DATABASE_URL: ${{ secrets.MC_LIVE_DATABASE_URL }}
        run: npm run migrate
      - name: Provision SharePoint (dev site, then production site)
        env:
          MICROSOFT_GRAPH_TENANT_ID: ${{ secrets.MICROSOFT_GRAPH_TENANT_ID }}
          MICROSOFT_GRAPH_CLIENT_ID: ${{ secrets.MICROSOFT_GRAPH_CLIENT_ID }}
          MICROSOFT_GRAPH_CLIENT_SECRET: ${{ secrets.MICROSOFT_GRAPH_CLIENT_SECRET }}
        run: |
          python3 scripts/provision-sharepoint.py --env staging --apply
          python3 scripts/provision-sharepoint.py --env production --apply
