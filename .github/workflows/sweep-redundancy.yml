# Sweep cadence redundancy (TASK-624) — a second, independent scheduler for
# the SharePoint mirror sweep AND the missed-tick watchdog, so a Vercel Cron
# outage neither stops sweeps nor silences the alert.
#
# Targets (matrix):
# - production is pinned to https://mc.plxcustomer.io
# - staging is the repo variable PLX_MC_STAGING_SWEEP_URL
#   (expected: https://mc-staging.plxcustomer.io, origin only, no path).
#   Unset/empty → that leg no-ops. A set URL must be on the allowlist below.
#
# Each armed target receives, in order:
#   GET /api/cron/missed-tick?beforeSweep=1  (observe a gap before recovery)
#   GET /api/cron/sweep                        (unless mode=watchdog)
# The watchdog route is not a Vercel Cron. Scheduled runs always do both.
# workflow_dispatch mode=watchdog is the outage drill: the strict 15-minute
# check, with no sweep afterward.
#
# Requires the repo secret PLX_MC_CRON_SECRET (same value as the deployment
# CRON_SECRET). Absent secret → the job no-ops instead of failing, so forks
# stay quiet. 503 from a target means that deployment has no CRON_SECRET;
# that is not a failure of this redundancy path.

name: sweep-redundancy

on:
  schedule:
    - cron: "7,22,37,52 * * * *" # every 15 min, offset from Vercel's */5 ticks
  workflow_dispatch:
    inputs:
      mode:
        description: "both = sweep then watchdog (scheduled default); watchdog = missed-tick only (outage drill)"
        type: choice
        required: false
        default: both
        options:
          - both
          - watchdog

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
            base_url: https://mc.plxcustomer.io
          - name: staging
            base_url: ${{ vars.PLX_MC_STAGING_SWEEP_URL }}
    steps:
      - name: Trigger sweep and missed-tick watchdog
        env:
          CRON_SECRET: ${{ secrets.PLX_MC_CRON_SECRET }}
          BASE_URL: ${{ matrix.base_url }}
          TARGET: ${{ matrix.name }}
          # schedule has no inputs; empty dispatch mode falls through to both.
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'both' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "PLX_MC_CRON_SECRET not configured — redundancy tick skipped."
            exit 0
          fi
          base=$(printf '%s' "$BASE_URL" | tr -d '[:space:]')
          if [ -z "$base" ]; then
            echo "No base URL for ${TARGET} — tick skipped (set repo variable PLX_MC_STAGING_SWEEP_URL to arm staging)."
            exit 0
          fi
          # Parse the origin. A shell glob matches userinfo and paths, which
          # would send the cron bearer to a host the variable did not name.
          base=$(BASE_URL="$base" python3 - <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit

          raw = os.environ.get("BASE_URL", "").strip()
          parsed = urlsplit(raw)
          host = (parsed.hostname or "").lower()
          # Exact origins only. A plx-mission-control-* prefix on vercel.app is
          # not reserved to this team, so a prefix match would send the bearer
          # to an unrelated deployment.
          allowed = {
              "mc.plxcustomer.io",
              "mc-staging.plxcustomer.io",
              "plx-mission-control.vercel.app",
          }
          if (
              parsed.scheme != "https"
              or parsed.username
              or parsed.password
              or parsed.query
              or parsed.fragment
              or parsed.path not in ("", "/")
              or parsed.port not in (None, 443)
              or host not in allowed
          ):
              sys.exit(1)
          sys.stdout.write(f"https://{host}")
          PY
          ) || {
            echo "Refusing ${TARGET} base URL outside the PLX MC allowlist."
            exit 1
          }
          mode="${MODE:-both}"
          if [ "$mode" != "both" ] && [ "$mode" != "watchdog" ]; then
            echo "Unknown mode: ${mode}"
            exit 1
          fi
          trigger() {
            path="$1"
            label="$2"
            body=$(mktemp)
            status=$(curl -sS -o "$body" -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              --max-time 90 \
              "${base}${path}") || status=000
            echo "${TARGET} ${label} returned HTTP ${status}"
            cat "$body" || true
            echo
            rm -f "$body"
            case "$status" in
              200|503) return 0 ;;
              *) return 1 ;;
            esac
          }
          # Observe first. A recovery sweep refreshes inbound stamps, which would
          # hide an extended gap from the watchdog in this same run.
          watchdog_path="/api/cron/missed-tick"
          if [ "$mode" != "watchdog" ]; then
            watchdog_path="/api/cron/missed-tick?beforeSweep=1"
          fi
          fail=0
          trigger "$watchdog_path" "missed-tick" || fail=1
          if [ "$mode" != "watchdog" ]; then
            trigger "/api/cron/sweep" "sweep" || fail=1
          fi
          exit "$fail"
