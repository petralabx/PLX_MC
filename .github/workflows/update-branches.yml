# update-branches (PR-drain item 4): keep open PRs current with their base.
#
# For each open, non-draft, same-repo PR that is behind its base, calls
#   PUT /repos/{owner}/{repo}/pulls/{n}/update-branch
# which MERGES the base into the head branch. It never rebases or force-pushes.
# Skips forks, drafts, and PRs labelled `hold` or `do-not-update`.
#
# SAFE BY DEFAULT: report-only. It updates branches only when BOTH are true:
#   1. repo variable UPDATE_BRANCHES_ENABLED == 'true'
#   2. repo secrets UPDATE_BRANCHES_APP_ID / UPDATE_BRANCHES_APP_KEY are set
# Why an App token: a merge made with GITHUB_TOKEN does not trigger
# pull_request workflows, so required checks would never post on the new head
# and the PR would be stuck. Adding that secret needs Vince's OK.
name: update-branches

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, do not update"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: update-branches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint App token (only when enabled and configured)
        id: app
        if: vars.UPDATE_BRANCHES_ENABLED == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.UPDATE_BRANCHES_APP_ID }}
          private-key: ${{ secrets.UPDATE_BRANCHES_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/github-script@v7
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const SKIP = new Set(['hold', 'do-not-update']);
            const writer = process.env.APP_TOKEN ? getOctokit(process.env.APP_TOKEN) : null;
            const mode = writer ? 'update' : 'report-only';
            core.info(`mode=${mode}`);
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const rows = [];
            for (const pr of prs) {
              const why = pr.draft ? 'draft'
                : pr.head.repo?.full_name !== `${owner}/${repo}` ? 'fork'
                : pr.labels.some(l => SKIP.has(l.name.toLowerCase())) ? 'label'
                : null;
              if (why) { rows.push([pr.number, 'skip', why]); continue; }
              let cmp;
              try {
                cmp = (await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${pr.base.ref}...${pr.head.sha}`, per_page: 1 })).data;
              } catch (e) { rows.push([pr.number, 'error', e.message]); continue; }
              if (!cmp.behind_by) { rows.push([pr.number, 'current', '']); continue; }
              if (!writer) { rows.push([pr.number, 'behind', `${cmp.behind_by} commits (report-only)`]); continue; }
              try {
                await writer.request('PUT /repos/{owner}/{repo}/pulls/{pull_number}/update-branch',
                  { owner, repo, pull_number: pr.number, expected_head_sha: pr.head.sha });
                rows.push([pr.number, 'updated', `merged ${cmp.behind_by} base commits`]);
              } catch (e) {
                // 422 = merge conflict or head moved; leave it for a human/agent.
                rows.push([pr.number, 'not-updated', `${e.status}: ${e.message}`.slice(0, 200)]);
              }
            }
            await core.summary.addHeading(`update-branches (${mode})`, 3)
              .addTable([[{ data: 'PR', header: true }, { data: 'result', header: true }, { data: 'detail', header: true }],
                ...rows.map(r => r.map(String))]).write();
            for (const r of rows) core.info(r.join('  '));
