# update-branches (PR-drain item 4): keep open PRs current with their base.
#
# Only for PRs that are on their way to merge: open, non-draft, same-repo PRs
# that have auto-merge enabled OR carry a queue label (`auto-merge`, `automerge`,
# `merge-queue`, `ready-to-merge`), and are behind their base. For those it calls
#   PUT /repos/{owner}/{repo}/pulls/{n}/update-branch
# which MERGES the base into the head branch. It never rebases or force-pushes.
# Skips forks, drafts, other PRs, and PRs labelled `hold` or `do-not-update`.
# AR-02: only the next PR to land is kept current. Queued PRs are taken oldest
# first (by creation time) and at most MAX_UPDATES (1) branch is updated per run;
# only a successful update counts toward the cap. A failed update (conflict,
# head moved) is reported and the next-oldest queued PR is tried. The rest wait
# for the next run (reported as `deferred`).
#
# WRITES HARD-DISABLED (TASK-3832, Sol P1 on update-branches.yml:91-92): this
# workflow is REPORT-ONLY until the MC compliance gate accepts pure base-sync
# merge commits. The update-branch API writes a bot merge commit with GitHub's
# default message and no Agent / On-Behalf-Of / MC-Checkout trailers; MC's
# /api/compliance/verify (src/lib/compliance/commit-signals.ts + service.ts)
# flags it as an unstamped agent commit and turns a green PR red. No App token
# is minted and the job only has read permissions, so it cannot write even if
# UPDATE_BRANCHES_ENABLED is set. To re-enable after the MC fix is deployed:
# restore the App-token step (create-github-app-token, contents/pull-requests
# write) and set WRITES_ENABLED below, in a reviewed PR approved by Vince.
name: update-branches

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, do not update"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: update-branches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/github-script@v7
        with:
          # Report-only: read-only GITHUB_TOKEN (see header; writes hard-disabled).
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const SKIP = new Set(['hold', 'do-not-update']);
            const QUEUE = new Set(['auto-merge', 'automerge', 'merge-queue', 'ready-to-merge']);
            const MAX_UPDATES = 1; // AR-02: only the next PR to land
            const WRITES_ENABLED = false; // hard-disabled until MC accepts base-sync merge commits (TASK-3832)
            const canWrite = WRITES_ENABLED;
            const mode = canWrite ? 'update' : 'report-only';
            core.info(`mode=${mode} max_updates=${MAX_UPDATES}`);
            let updated = 0;
            const prs = (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', sort: 'created', direction: 'asc', per_page: 100 }))
              .sort((x, y) => new Date(x.created_at) - new Date(y.created_at) || x.number - y.number); // oldest queued first
            const rows = [];
            for (const pr of prs) {
              const why = pr.draft ? 'draft'
                : pr.head.repo?.full_name !== `${owner}/${repo}` ? 'fork'
                : pr.labels.some(l => SKIP.has(l.name.toLowerCase())) ? 'label'
                : !(pr.auto_merge || pr.labels.some(l => QUEUE.has(l.name.toLowerCase()))) ? 'not-queued'
                : null;
              if (why) { rows.push([pr.number, 'skip', why]); continue; }
              let cmp;
              try {
                cmp = (await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${pr.base.ref}...${pr.head.sha}`, per_page: 1 })).data;
              } catch (e) { rows.push([pr.number, 'error', e.message]); continue; }
              if (!cmp.behind_by) { rows.push([pr.number, 'current', '']); continue; }
              if (!canWrite) { rows.push([pr.number, 'behind', `${cmp.behind_by} commits (report-only)`]); continue; }
              if (updated >= MAX_UPDATES) { rows.push([pr.number, 'deferred', `cap of ${MAX_UPDATES} reached`]); continue; }
              try {
                await github.request('PUT /repos/{owner}/{repo}/pulls/{pull_number}/update-branch',
                  { owner, repo, pull_number: pr.number, expected_head_sha: pr.head.sha });
                updated++; // only successes count toward the cap
                rows.push([pr.number, 'updated', `merged ${cmp.behind_by} base commits`]);
              } catch (e) {
                // 422 = merge conflict or head moved; leave it for a human/agent.
                rows.push([pr.number, 'not-updated', `${e.status}: ${e.message}`.slice(0, 200)]);
              }
            }
            await core.summary.addHeading(`update-branches (${mode})`, 3)
              .addTable([[{ data: 'PR', header: true }, { data: 'result', header: true }, { data: 'detail', header: true }],
                ...rows.map(r => r.map(String))]).write();
            for (const r of rows) core.info(r.join('  '));
