  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"810c484c-a0a0-4c37-a025-5bc3cd90ea4b\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>/* ══════════════════════════════════════════════════════════════════════════\n   PETRA LAB-X — COLORS & TYPE\n   Single stylesheet you can drop into any PLX artifact (slide, mock, prototype,\n   production page). Defines the brand token layer (--p-*), font stacks, the\n   editorial type scale, and a small set of semantic element + utility styles.\n\n   Load the webfonts first (all free / open — hosted via CDN, links below):\n     <link href=\"https://api.fontshare.com/v2/css?f[]=mazius-display@400,401&display=swap\" rel=\"stylesheet\">\n     <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\n   Three type stacks, three jobs:\n     · Mazius Display (serif) — page heroes, deed titles, the pause-here moments.\n     · Inter (sans)           — body, labels, tables, navigation.\n     · JetBrains Mono (mono)  — kickers, IDs, timestamps, data, chassis ticks.\n   ══════════════════════════════════════════════════════════════════════════ */\n\n:root {\n  /* ─── SURFACES — document model · paper is first-class ─────────────────── */\n  --p-paper:        #FBF9F5;   /* 1° — page + cards (primary surface)        */\n  --p-paper-2:      #F2EDE2;   /* 2° — recess: rails, footers, hovers, bands */\n  /* MRP instrument-panel adds two extra surface steps for dense ops layouts: */\n  --p-rail:         #EEEBE3;   /* 0° — global rail / inner sidebar / labels  */\n  --p-canvas:       #F5F3EC;   /* page bg beneath cards on dense surfaces     */\n\n  /* ─── TEXT — three steps of warm near-black ───────────────────────────── */\n  --p-ink:          #1B1A17;   /* primary text + dark CTAs                   */\n  --p-ink-2:        #3A3833;   /* secondary text, body                       */\n  --p-muted:        #807A6F;   /* tertiary, mono labels, captions            */\n\n  /* ─── HAIRLINES — translucent ink, never solid grey ───────────────────── */\n  --p-grid:         rgba(27, 26, 23, 0.16);   /* cards, dividers             */\n  --p-grid-2:       rgba(27, 26, 23, 0.08);   /* row separators, inner KPIs  */\n\n  /* ─── ACCENT — forest · the one chromatic moment ──────────────────────── */\n  --p-accent:       #244A39;   /* primary action, active state, italic word */\n  --p-accent-soft:  #BCCFBF;   /* tints, accent backgrounds, hover wash      */\n\n  /* ─── STATUS — earth-toned, NOT saturated alarm colors ────────────────── */\n  --p-ok:           #5C7A55;   /* sage   — approved / live / signed / sealed */\n  --p-warn:         #C99340;   /* amber  — pending / in review / open flag   */\n  --p-info:         #5B7B91;   /* steel  — informational / new               */\n  --p-hot:          #52606E;   /* mineral— destructive ONLY                  */\n\n  /* ─── TYPE STACKS ─────────────────────────────────────────────────────── */\n  --p-font-serif:   \"Mazius Display\", \"Times New Roman\", Georgia, serif;\n  --p-font-sans:    \"Inter\", -apple-system, system-ui, sans-serif;\n  --p-font-mono:    \"JetBrains Mono\", \"IBM Plex Mono\", ui-monospace, monospace;\n  /* short aliases — both work */\n  --mazius:         var(--p-font-serif);\n  --sans:           var(--p-font-sans);\n  --mono:           var(--p-font-mono);\n\n  /* ─── TYPE SCALE — editorial, generous ────────────────────────────────── */\n  --p-text-display: 56px;      /* page heroes, login moments (scales up to 152 on marketing) */\n  --p-text-h1:      32px;      /* section titles in folio                    */\n  --p-text-h2:      24px;      /* subsection                                 */\n  --p-text-h3:      18px;      /* card titles                                */\n  --p-text-body:    14px;      /* body                                       */\n  --p-text-small:   12px;      /* captions                                   */\n  --p-text-mono:    11px;      /* default mono                               */\n  --p-text-tick:    9px;       /* chassis ticks, smallest kicker labels      */\n\n  /* ─── LETTER-SPACING — mono labels need air ───────────────────────────── */\n  --p-track-tick:   0.22em;    /* smallest mono labels / chassis ticks       */\n  --p-track-meta:   0.18em;    /* standard mono captions / pill text         */\n  --p-track-data:   0.04em;    /* numeric data with tabular-nums             */\n\n  /* ─── RADIUS — nearly sharp; we are not a squishy SaaS app ────────────── */\n  --p-radius:       4px;       /* default — cards                            */\n  --p-radius-sm:    3px;       /* pills, tints                               */\n  --p-radius-lg:    6px;       /* quote tiles, banded dossier wraps          */\n  /* Buttons and status pills have NO radius — sharp rectangles.             */\n\n  /* ─── SPACING — multiples of 4 with a 14 break for editorial rhythm ───── */\n  --p-space-1:      4px;\n  --p-space-2:      8px;\n  --p-space-3:      14px;      /* the intentional \"14 break\"                 */\n  --p-space-4:      22px;\n  --p-space-5:      32px;\n  --p-space-6:      48px;\n  --p-space-7:      72px;\n\n  /* ─── MOTION — short, decisive · no springs, no bounces ───────────────── */\n  --p-ease:         cubic-bezier(0.2, 0.8, 0.2, 1); /* @kind other */\n  --p-dur-fast:     120ms; /* @kind other */\n  --p-dur:          180ms; /* @kind other */\n  --p-dur-slow:     320ms; /* @kind other */\n}\n\n/* ─── DARK SCHEME ───────────────────────────────────────────────────────── */\n.dark, [data-scheme=\"dark\"] {\n  --p-paper:        #1A1816;\n  --p-paper-2:      #22201D;\n  --p-rail:         #16140F;\n  --p-canvas:       #1A1816;\n  --p-ink:          #F1ECE0;\n  --p-ink-2:        #C9C2B5;\n  --p-muted:        #827B6F;\n  --p-grid:         rgba(241, 236, 224, 0.12);\n  --p-grid-2:       rgba(241, 236, 224, 0.06);\n  --p-accent:       #7AB18C;\n  --p-accent-soft:  #2D4D3B;\n  --p-ok:           #7A9E6F;\n  --p-warn:         #D9A85C;\n  --p-info:         #7A9DB3;\n  --p-hot:          #8FA0B0;\n}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   SEMANTIC ELEMENTS — sensible defaults so raw HTML lands on-brand.\n   Scope under .plx so the stylesheet never hijacks unrelated markup.\n   ══════════════════════════════════════════════════════════════════════════ */\n\n.plx {\n  background: var(--p-paper);\n  color: var(--p-ink);\n  font-family: var(--sans);\n  font-size: var(--p-text-body);\n  line-height: 1.55;\n  font-feature-settings: \"ss01\", \"ss02\";\n  -webkit-font-smoothing: antialiased;\n}\n\n.plx h1, .plx h2, .plx h3 {\n  font-family: var(--mazius);\n  font-weight: 400;\n  color: var(--p-ink);\n  margin: 0 0 var(--p-space-3);\n  text-wrap: balance;\n}\n.plx h1 { font-size: var(--p-text-h1); line-height: 1.04; letter-spacing: -0.02em; }\n.plx h2 { font-size: var(--p-text-h2); line-height: 1.08; letter-spacing: -0.015em; }\n.plx h3 { font-size: var(--p-text-h3); line-height: 1.15; letter-spacing: -0.012em; }\n/* the signature move: a single italic forest accent word inside a serif headline */\n.plx h1 em, .plx h2 em, .plx h3 em, .plx .serif em { font-style: italic; color: var(--p-accent); }\n\n.plx p { margin: 0 0 var(--p-space-3); color: var(--p-ink-2); max-width: 68ch; text-wrap: pretty; }\n.plx a { color: var(--p-accent); text-decoration: none; }\n.plx a:hover { text-decoration: underline; text-underline-offset: 2px; }\n.plx strong { font-weight: 600; color: var(--p-ink); }\n.plx hr { border: 0; border-top: 1px solid var(--p-grid); margin: var(--p-space-5) 0; }\n.plx code, .plx pre {\n  font-family: var(--mono);\n  font-size: var(--p-text-mono);\n  background: var(--p-paper-2);\n  border: 1px solid var(--p-grid-2);\n}\n.plx code { padding: 1px 5px; border-radius: var(--p-radius-sm); }\n.plx pre { padding: var(--p-space-3) var(--p-space-4); border-radius: var(--p-radius); overflow: auto; }\n\n/* ══════════════════════════════════════════════════════════════════════════\n   UTILITY CLASSES — the editorial moments shadcn / plain HTML don't cover.\n   Keep this list short.\n   ══════════════════════════════════════════════════════════════════════════ */\n\n.plx .serif    { font-family: var(--mazius); font-weight: 400; }\n.plx .mono     { font-family: var(--mono); font-variant-numeric: tabular-nums; }\n\n/* kicker — THE brand signature: tiny uppercase mono with generous tracking.\n   Reads as instrumentation (a label on a panel), not a UI string. */\n.plx .kicker   { font-family: var(--mono); font-size: var(--p-text-tick); letter-spacing: var(--p-track-tick); text-transform: uppercase; color: var(--p-muted); }\n.plx .meta     { font-family: var(--mono); font-size: 10px; letter-spacing: var(--p-track-meta); text-transform: uppercase; color: var(--p-muted); }\n.plx .data     { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: var(--p-track-data); }\n.plx .hairline { border: 0; border-top: 1px solid var(--p-grid); margin: 0; }\n\n/* status pill — sharp rectangle, color from border + text + dot, never fill */\n.plx .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid currentColor; font-family: var(--mono); font-size: 9px; letter-spacing: var(--p-track-meta); text-transform: uppercase; }\n.plx .pill .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }\n.plx .pill.ok   { color: var(--p-ok); }\n.plx .pill.warn { color: var(--p-warn); }\n.plx .pill.info { color: var(--p-info); }\n.plx .pill.hot  { color: var(--p-hot); }\n.plx .pill.acc  { color: var(--p-accent); }\n\n/* button — ink-on-paper filled; ghost = hairline outline. Mono uppercase. */\n.plx .btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--p-ink); background: var(--p-ink); color: var(--p-paper); font-family: var(--mono); font-size: 10px; letter-spacing: var(--p-track-meta); text-transform: uppercase; cursor: pointer; transition: all var(--p-dur-fast) var(--p-ease); }\n.plx .btn:hover { background: var(--p-accent); border-color: var(--p-accent); }\n.plx .btn.ghost { background: transparent; color: var(--p-ink); border-color: var(--p-grid); }\n.plx .btn.ghost:hover { background: transparent; border-color: var(--p-ink); }\n.plx .btn.acc { background: var(--p-accent); border-color: var(--p-accent); color: #fff; }\n\n/* card — paper + hairline. No shadow. Wakes on hover by darkening the border. */\n.plx .card { background: var(--p-paper); border: 1px solid var(--p-grid); border-radius: var(--p-radius); padding: var(--p-space-4); transition: border-color var(--p-dur) var(--p-ease); }\n.plx .card:hover { border-color: var(--p-ink-2); }\n<\u002Fstyle>\n  <style>/* PLX Design System — canonical entry stylesheet.\n   The compiler reads this file (and everything it @imports) for tokens + fonts.\n   Mazius Display is self-hosted (free, by Alberto Casagrande / Collletttivo — see fonts/LICENSE.txt).\n   Inter + JetBrains Mono load from Google Fonts CDN. */\n\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e77b54ce-6276-440c-bd60-10e5dbe21e6d\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"931ce0c9-83b8-4102-8ef2-1eea96407a30\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"0ebfab47-52ee-44fe-b663-c51d6a4d000d\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font- e.com/v2/css?f[]=mazius-display@400,401&display=swap\" rel=\"stylesheet\">\n     <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\n   Three type stacks, three jobs:\n     · Mazius Display (serif) — page heroes, deed titles, the pause-here moments.\n     · Inter (sans)           — body, labels, tables, navigation.\n     · JetBrains Mono (mono)  — kickers, IDs, timestamps, data, chassis ticks.\n   ══════════════════════════════════════════════════════════════════════════ */\n\n:root {\n  /* ─── SURFACES — document model · paper is first-class ─────────────────── */\n  --p-paper:        #FBF9F5;   /* 1° — page + cards (primary surface)        */\n  --p-paper-2:      #F2EDE2;   /* 2° — recess: rails, footers, hovers, bands */\n  /* MRP instrument-panel adds two extra surface steps for dense ops layouts: */\n  --p-rail:         #EEEBE3;   /* 0° — global rail / inner sidebar / labels  */\n  --p-canvas:       #F5F3EC;   /* page bg beneath cards on dense surfaces     */\n\n  /* ─── TEXT — three steps of warm near-black ───────────────────────────── */\n  --p-ink:          #1B1A17;   /* primary text + dark CTAs                   */\n  --p-ink-2:        #3A3833;   /* secondary text, body                       */\n  --p-muted:        #807A6F;   /* tertiary, mono labels, captions            */\n\n  /* ─── HAIRLINES — translucent ink, never solid grey ───────────────────── */\n  --p-grid:         rgba(27, 26, 23, 0.16);   /* cards, dividers             */\n  --p-grid-2:       rgba(27, 26, 23, 0.08);   /* row separators, inner KPIs  */\n\n  /* ─── ACCENT — forest · the one chromatic moment ──────────────────────── */\n  --p-accent:       #244A39;   /* primary action, active state, italic word */\n  --p-accent-soft:  #BCCFBF;   /* tints, accent backgrounds, hover wash      */\n\n  /* ─── STATUS — earth-toned, NOT saturated alarm colors ────────────────── */\n  --p-ok:           #5C7A55;   /* sage   — approved / live / signed / sealed */\n  --p-warn:         #C99340;   /* amber  — pending / in review / open flag   */\n  --p-info:         #5B7B91;   /* steel  — informational / new               */\n  --p-hot:          #52606E;   /* mineral— destructive ONLY                  */\n\n  /* ─── TYPE STACKS ─────────────────────────────────────────────────────── */\n  --p-font-serif:   \"Mazius Display\", \"Times New Roman\", Georgia, serif;\n  --p-font-sans:    \"Inter\", -apple-system, system-ui, sans-serif;\n  --p-font-mono:    \"JetBrains Mono\", \"IBM Plex Mono\", ui-monospace, monospace;\n  /* short aliases — both work */\n  --mazius:         var(--p-font-serif);\n  --sans:           var(--p-font-sans);\n  --mono:           var(--p-font-mono);\n\n  /* ─── TYPE SCALE — editorial, generous ────────────────────────────────── */\n  --p-text-display: 56px;      /* page heroes, login moments (scales up to 152 on marketing) */\n  --p-text-h1:      32px;      /* section titles in folio                    */\n  --p-text-h2:      24px;      /* subsection                                 */\n  --p-text-h3:      18px;      /* card titles                                */\n  --p-text-body:    14px;      /* body                                       */\n  --p-text-small:   12px;      /* captions                                   */\n  --p-text-mono:    11px;      /* default mono                               */\n  --p-text-tick:    9px;       /* chassis ticks, smallest kicker labels      */\n\n  /* ─── LETTER-SPACING — mono labels need air ───────────────────────────── */\n  --p-track-tick:   0.22em;    /* smallest mono labels / chassis ticks       */\n  --p-track-meta:   0.18em;    /* standard mono captions / pill text         */\n  --p-track-data:   0.04em;    /* numeric data with tabular-nums             */\n\n  /* ─── RADIUS — nearly sharp; we are not a squishy SaaS app ────────────── */\n  --p-radius:       4px;       /* default — cards                            */\n  --p-radius-sm:    3px;       /* pills, tints                               */\n  --p-radius-lg:    6px;       /* quote tiles, banded dossier wraps          */\n  /* Buttons and status pills have NO radius — sharp rectangles.             */\n\n  /* ─── SPACING — multiples of 4 with a 14 break for editorial rhythm ───── */\n  --p-space-1:      4px;\n  --p-space-2:      8px;\n  --p-space-3:      14px;      /* the intentional \"14 break\"                 */\n  --p-space-4:      22px;\n  --p-space-5:      32px;\n  --p-space-6:      48px;\n  --p-space-7:      72px;\n\n  /* ─── MOTION — short, decisive · no springs, no bounces ───────────────── */\n  --p-ease:         cubic-bezier(0.2, 0.8, 0.2, 1); /* @kind other */\n  --p-dur-fast:     120ms; /* @kind other */\n  --p-dur:          180ms; /* @kind other */\n  --p-dur-slow:     320ms; /* @kind other */\n}\n\n/* ─── DARK SCHEME ───────────────────────────────────────────────────────── */\n.dark, [data-scheme=\"dark\"] {\n  --p-paper:        #1A1816;\n  --p-paper-2:      #22201D;\n  --p-rail:         #16140F;\n  --p-canvas:       #1A1816;\n  --p-ink:          #F1ECE0;\n  --p-ink-2:        #C9C2B5;\n  --p-muted:        #827B6F;\n  --p-grid:         rgba(241, 236, 224, 0.12);\n  --p-grid-2:       rgba(241, 236, 224, 0.06);\n  --p-accent:       #7AB18C;\n  --p-accent-soft:  #2D4D3B;\n  --p-ok:           #7A9E6F;\n  --p-warn:         #D9A85C;\n  --p-info:         #7A9DB3;\n  --p-hot:          #8FA0B0;\n}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   SEMANTIC ELEMENTS — sensible defaults so raw HTML lands on-brand.\n   Scope under .plx so the stylesheet never hijacks unrelated markup.\n   ══════════════════════════════════════════════════════════════════════════ */\n\n.plx {\n  background: var(--p-paper);\n  color: var(--p-ink);\n  font-family: var(--sans);\n  font-size: var(--p-text-body);\n  line-height: 1.55;\n  font-feature-settings: \"ss01\", \"ss02\";\n  -webkit-font-smoothing: antialiased;\n}\n\n.plx h1, .plx h2, .plx h3 {\n  font-family: var(--mazius);\n  font-weight: 400;\n  color: var(--p-ink);\n  margin: 0 0 var(--p-space-3);\n  text-wrap: balance;\n}\n.plx h1 { font-size: var(--p-text-h1); line-height: 1.04; letter-spacing: -0.02em; }\n.plx h2 { font-size: var(--p-text-h2); line-height: 1.08; letter-spacing: -0.015em; }\n.plx h3 { font-size: var(--p-text-h3); line-height: 1.15; letter-spacing: -0.012em; }\n/* the signature move: a single italic forest accent word inside a serif headline */\n.plx h1 em, .plx h2 em, .plx h3 em, .plx .serif em { font-style: italic; color: var(--p-accent); }\n\n.plx p { margin: 0 0 var(--p-space-3); color: var(--p-ink-2); max-width: 68ch; text-wrap: pretty; }\n.plx a { color: var(--p-accent); text-decoration: none; }\n.plx a:hover { text-decoration: underline; text-underline-offset: 2px; }\n.plx strong { font-weight: 600; color: var(--p-ink); }\n.plx hr { border: 0; border-top: 1px solid var(--p-grid); margin: var(--p-space-5) 0; }\n.plx code, .plx pre {\n  font-family: var(--mono);\n  font-size: var(--p-text-mono);\n  background: var(--p-paper-2);\n  border: 1px solid var(--p-grid-2);\n}\n.plx code { padding: 1px 5px; border-radius: var(--p-radius-sm); }\n.plx pre { padding: var(--p-space-3) var(--p-space-4); border-radius: var(--p-radius); overflow: auto; }\n\n/* ══════════════════════════════════════════════════════════════════════════\n   UTILITY CLASSES — the editorial moments shadcn / plain HTML don't cover.\n   Keep this list short.\n   ══════════════════════════════════════════════════════════════════════════ */\n\n.plx .serif    { font-family: var(--mazius); font-weight: 400; }\n.plx .mono     { font-family: var(--mono); font-variant-numeric: tabular-nums; }\n\n/* kicker — THE brand signature: tiny uppercase mono with generous tracking.\n   Reads as instrumentation (a label on a panel), not a UI string. */\n.plx .kicker   { font-family: var(--mono); font-size: var(--p-text-tick); letter-spacing: var(--p-track-tick); text-transform: uppercase; color: var(--p-muted); }\n.plx .meta     { font-family: var(--mono); font-size: 10px; letter-spacing: var(--p-track-meta); text-transform: uppercase; color: var(--p-muted); }\n.plx .data     { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: var(--p-track-data); }\n.plx .hairline { border: 0; border-top: 1px solid var(--p-grid); margin: 0; }\n\n/* status pill — sharp rectangle, color from border + text + dot, never fill */\n.plx .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid currentColor; font-family: var(--mono); font-size: 9px; letter-spacing: var(--p-track-meta); text-transform: uppercase; }\n.plx .pill .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }\n.plx .pill.ok   { color: var(--p-ok); }\n.plx .pill.warn { color: var(--p-warn); }\n.plx .pill.info { color: var(--p-info); }\n.plx .pill.hot  { color: var(--p-hot); }\n.plx .pill.acc  { color: var(--p-accent); }\n\n/* button — ink-on-paper filled; ghost = hairline outline. Mono uppercase. */\n.plx .btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--p-ink); background: var(--p-ink); color: var(--p-paper); font-family: var(--mono); font-size: 10px; letter-spacing: var(--p-track-meta); text-transform: uppercase; cursor: pointer; transition: all var(--p-dur-fast) var(--p-ease); }\n.plx .btn:hover { background: var(--p-accent); border-color: var(--p-accent); }\n.plx .btn.ghost { background: transparent; color: var(--p-ink); border-color: var(--p-grid); }\n.plx .btn.ghost:hover { background: transparent; border-color: var(--p-ink); }\n.plx .btn.acc { background: var(--p-accent); border-color: var(--p-accent); color: #fff; }\n\n/* card — paper + hairline. No shadow. Wakes on hover by darkening the border. */\n.plx .card { background: var(--p-paper); border: 1px solid var(--p-grid); border-radius: var(--p-radius); padding: var(--p-space-4); transition: border-color var(--p-dur) var(--p-ease); }\n.plx .card:hover { border-color: var(--p-ink-2); }\n\n<\u002Fstyle>\n  <script src=\"8abfe609-265d-49fd-ba1e-f4acdbe5195a\"><\u002Fscript>\n  <style>\n    html, body { margin:0; padding:0; background:#F5F3EC; }\n    a { color:#244A39; text-decoration:none; }\n    a:hover { text-decoration:underline; text-underline-offset:2px; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"plx\" style=\"min-height:100vh; background:var(--p-canvas); padding-bottom:72px;\">\n\n  <header data-screen-label=\"Masthead\" style=\"background:var(--p-paper); border-bottom:1px solid var(--p-grid);\">\n    <div style=\"max-width:1280px; margin:0 auto; padding:44px 40px 40px; display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center; gap:22px; flex-wrap:wrap;\">\n        <img src=\"a9931d26-6a0d-4ea1-b07c-5ba4d42eb70a\" alt=\"Petra Lab-X\" style=\"height:22px; display:block;\">\n        <div class=\"meta\">EMAIL STANDARD PLX-EM-02 · EFFECTIVE 2026-08-12<\u002Fdiv>\n      <\u002Fdiv>\n      <h1 style=\"font-size:54px; line-height:1.02; letter-spacing:-0.02em; margin:22px 0 0; max-width:20ch;\">Every send is a <em>document<\u002Fem>.<\u002Fh1>\n      <p style=\"max-width:64ch; font-size:15px; margin:4px 0 0;\">The PLX standard for transactional email — one shell, six archetypes, warm paper. Brand tokens mirrored as email-safe hex, hardened for Outlook, using the repo’s canonical email tokens as-is.<\u002Fp>\n      <div style=\"display:flex; gap:22px; flex-wrap:wrap; margin-top:14px; align-items:center;\">\n        <span class=\"meta\">REPO petralabx/plx-customer-portal @ STAGING<\u002Fspan>\n        <span class=\"meta\">SOP docs/design-system/EMAIL-STYLE-SOP.md<\u002Fspan>\n        <span class=\"meta\">CODE portal/src/lib/notifications/email-theme.ts<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ showAudit }}\" hint-placeholder-val=\"{{ true }}\">\n  <section data-screen-label=\"Staging audit\" style=\"max-width:1280px; margin:0 auto; padding:52px 40px 0;\">\n    <div class=\"meta\" style=\"margin-bottom:10px;\">SECTION 01 · AUDIT<\u002Fdiv>\n    <h2 style=\"font-size:26px;\">What's on origin/staging<\u002Fh2>\n    <div class=\"hairline\" style=\"margin:14px 0 24px;\"><\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:22px;\">\n      <div class=\"card\" style=\"padding:22px; display:flex; flex-direction:column; gap:10px;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:center; gap:8px;\">\n          <span class=\"mono\" style=\"font-size:11px; color:var(--p-muted);\">01<\u002Fspan>\n          <span class=\"pill ok\"><span class=\"dot\"><\u002Fspan>KEEP THE ARCHITECTURE<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin:0;\">A standard already exists<\u002Fh3>\n        <p style=\"font-size:13px; margin:0;\"><code>EMAIL-STYLE-SOP.md<\u002Fcode> v1.0 (2026-06-24) plus a real theme module — <code>emailShell<\u002Fcode>, <code>emailButton<\u002Fcode>, <code>emailBox<\u002Fcode>, <code>emailKicker<\u002Fcode> — and ~12 typed builders (approved, rejected, revision, welcome, digest, PO cover, password reset…). Your agent had a spec to follow.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:22px; display:flex; flex-direction:column; gap:10px;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:center; gap:8px;\">\n          <span class=\"mono\" style=\"font-size:11px; color:var(--p-muted);\">02<\u002Fspan>\n          <span class=\"pill info\"><span class=\"dot\"><\u002Fspan>RESPECTED AS-IS<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin:0;\">Email runs its own surface<\u002Fh3>\n        <p style=\"font-size:13px; margin:0;\">ADR-007 (2026-08-06) deliberately adopted the MRP surface into email: a sage-tinted recess and cooler muted ink. Those tokens are canonical in the repo, so this standard uses them verbatim — the send’s problems are structural, not the tokens.<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:auto 1fr 1fr; gap:8px 14px; align-items:center; margin-top:4px;\">\n          <span class=\"meta\" style=\"font-size:9px;\">RECESS<\u002Fspan>\n          <span style=\"display:flex; align-items:center; gap:8px;\"><span style=\"width:16px; height:16px; background:#ECEFE9; border:1px solid var(--p-grid); flex:none;\"><\u002Fspan><span class=\"mono\" style=\"font-size:10px;\">#ECEFE9 · EMAIL CANON<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex; align-items:center; gap:8px;\"><span style=\"width:16px; height:16px; background:#F2EDE2; border:1px solid var(--p-grid); flex:none;\"><\u002Fspan><span class=\"mono\" style=\"font-size:10px; color:var(--p-muted);\">#F2EDE2 · BRAND UI<\u002Fspan><\u002Fspan>\n          <span class=\"meta\" style=\"font-size:9px;\">MUTED<\u002Fspan>\n          <span style=\"display:flex; align-items:center; gap:8px;\"><span style=\"width:16px; height:16px; background:#6B665B; flex:none;\"><\u002Fspan><span class=\"mono\" style=\"font-size:10px;\">#6B665B · EMAIL CANON<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex; align-items:center; gap:8px;\"><span style=\"width:16px; height:16px; background:#807A6F; flex:none;\"><\u002Fspan><span class=\"mono\" style=\"font-size:10px; color:var(--p-muted);\">#807A6F · BRAND UI<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:22px; display:flex; flex-direction:column; gap:10px;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:center; gap:8px;\">\n          <span class=\"mono\" style=\"font-size:11px; color:var(--p-muted);\">03<\u002Fspan>\n          <span class=\"pill acc\"><span class=\"dot\"><\u002Fspan>REBUILT BELOW<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin:0;\">The send bypassed the shell<\u002Fh3>\n        <p style=\"font-size:13px; margin:0;\">The owners-tour email was hand-rolled: the ink header bar dropped in Outlook (paper-colored text on white — the invisible \"Customer Portal\"), CTAs became underlined mono strings and a micro-chip, and <code>--p-accent-soft<\u002Fcode> ran as full-width fields. Section 05 rebuilds it on standard.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section data-screen-label=\"Foundations\" style=\"max-width:1280px; margin:0 auto; padding:52px 40px 0;\">\n    <div class=\"meta\" style=\"margin-bottom:10px;\">SECTION 02 · FOUNDATIONS<\u002Fdiv>\n    <h2 style=\"font-size:26px;\">Email-safe tokens<\u002Fh2>\n    <p style=\"font-size:13px; max-width:70ch;\">Mail clients can't resolve <code>var(--p-*)<\u002Fcode>, so the brand mirrors to literal hex in <code>email-theme.ts<\u002Fcode>. Every value below is the repo’s canonical email constant, verbatim — no invented colors.<\u002Fp>\n    <div class=\"hairline\" style=\"margin:14px 0 24px;\"><\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:22px; align-items:start;\">\n      <div class=\"card\" style=\"padding:22px;\">\n        <div class=\"meta\" style=\"margin-bottom:14px;\">SURFACES &amp; LINES<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column;\">\n          <div style=\"display:flex; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--p-grid-2);\"><span style=\"width:18px; height:18px; background:#ECEFE9; border:1px solid var(--p-grid); flex:none;\"><\u002Fspan><span style=\"font-size:13px; flex:1;\">Page &amp; footer band<\u002Fspan><span class=\"mono\" style=\"font-size:10px;\">#ECEFE9 · PAPER-2<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--p-grid-2);\"><span style=\"width:18px; height:18px; background:#FBFAF6; border:1px solid var(--p-grid); flex:none;\"><\u002Fspan><span style=\"font-size:13px; flex:1;\">Card<\u002Fspan><span class=\"mono\" style=\"font-size:10px;\">#FBFAF6 · PAPER<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--p-grid-2);\"><span style=\"width:18px; height:18px; background:#1B1A17; flex:none;\"><\u002Fspan><span style=\"font-size:13px; flex:1;\">Header bar, buttons, headings<\u002Fspan><span class=\"mono\" style=\"font-size:10px;\">#1B1A17 · INK<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--p-grid-2);\"><span style=\"width:18px; height:18px; background:#3A3833; flex:none;\"><\u002Fspan><span style=\"font-size:13px; flex:1;\">Body copy<\u002Fspan><span class=\"mono\" style=\"font-size:10px;\">#3A3833 · INK-2<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--p-grid-2);\"><span style=\"width:18px; height:18px; background:#6B665B; flex:none;\"><\u002Fspan><span style=\"font-size:13px; flex:1;\">Kicker, meta, footer<\u002Fspan><span class=\"mono\" style=\"font-size:10px;\">#6B665B · MUTED<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--p-grid-2);\"><span style=\"width:18px; height:18px; background:#E4E0D6; flex:none;\"><\u002Fspan><span style=\"font-size:13px; flex:1;\">Hairline<\u002Fspan><span class=\"mono\" style=\"font-size:10px;\">#E4E0D6 ≈ GRID<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; padding:8px 0 0; border-top:1px solid var(--p-grid-2);\"><span style=\"width:18px; height:18px; background:#EFEBE2; flex:none;\"><\u002Fspan><span style=\"font-size:13px; flex:1;\">Soft hairline<\u002Fspan><span class=\"mono\" style=\"font-size:10px;\">#EFEBE2 ≈ GRID-2<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:22px;\">\n        <div class=\"meta\" style=\"margin-bottom:14px;\">STATUS — EARTH-TONED, NEVER NEON<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column;\">\n          <div style=\"display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--p-grid-2);\"><span style=\"display:flex; gap:4px; flex:none;\"><span style=\"width:18px; height:18px; background:#244A39;\"><\u002Fspan><span style=\"width:18px; height:18px; background:#BCCFBF; border:1px solid var(--p-grid);\"><\u002Fspan><\u002Fspan><span style=\"font-size:13px; flex:1;\"><strong>Forest<\u002Fstrong> — links, CTA hover. Rationed.<\u002Fspan><span class=\"mono\" style=\"font-size:10px;\">#244A39<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--p-grid-2);\"><span style=\"display:flex; gap:4px; flex:none;\"><span style=\"width:18px; height:18px; background:#5C7A55;\"><\u002Fspan><span style=\"width:18px; height:18px; background:#EAF0E6; border:1px solid var(--p-grid);\"><\u002Fspan><\u002Fspan><span style=\"font-size:13px; flex:1;\"><strong>Sage<\u002Fstrong> — approved, signed, live.<\u002Fspan><span class=\"mono\" style=\"font-size:10px;\">#5C7A55<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--p-grid-2);\"><span style=\"display:flex; gap:4px; flex:none;\"><span style=\"width:18px; height:18px; background:#C99340;\"><\u002Fspan><span style=\"width:18px; height:18px; background:#FAF1DF; border:1px solid var(--p-grid);\"><\u002Fspan><\u002Fspan><span style=\"font-size:13px; flex:1;\"><strong>Amber<\u002Fstrong> — pending, revision, expiry.<\u002Fspan><span class=\"mono\" style=\"font-size:10px;\">#C99340<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--p-grid-2);\"><span style=\"display:flex; gap:4px; flex:none;\"><span style=\"width:18px; height:18px; background:#5B7B91;\"><\u002Fspan><span style=\"width:18px; height:18px; background:#E8EFF3; border:1px solid var(--p-grid);\"><\u002Fspan><\u002Fspan><span style=\"font-size:13px; flex:1;\"><strong>Steel<\u002Fstrong> — informational.<\u002Fspan><span class=\"mono\" style=\"font-size:10px;\">#5B7B91<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; padding:9px 0 0; border-top:1px solid var(--p-grid-2);\"><span style=\"display:flex; gap:4px; flex:none;\"><span style=\"width:18px; height:18px; background:#52606E;\"><\u002Fspan><span style=\"width:18px; height:18px; background:#E7EAEC; border:1px solid var(--p-grid);\"><\u002Fspan><\u002Fspan><span style=\"font-size:13px; flex:1;\"><strong>Mineral<\u002Fstrong> — rejected, destructive only. Not red.<\u002Fspan><span class=\"mono\" style=\"font-size:10px;\">#52606E<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:12px; color:var(--p-muted); margin:14px 0 0;\">Soft tones tint boxes and rules only — no soft color ever runs as a full-width band.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:22px;\">\n        <div class=\"meta\" style=\"margin-bottom:14px;\">TYPE — FALLBACK-FIRST STACKS<\u002Fdiv>\n        <div style=\"padding:8px 0; border-top:1px solid var(--p-grid-2);\">\n          <div style=\"font-family:Georgia, 'Times New Roman', serif; font-size:20px; color:var(--p-ink);\">A <em style=\"color:var(--p-accent);\">partner<\u002Fem>, not a vendor<\u002Fdiv>\n          <div class=\"mono\" style=\"font-size:10px; color:var(--p-muted); margin-top:4px;\">SERIF · TITLES · Georgia, 'Times New Roman'<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:10px 0; border-top:1px solid var(--p-grid-2);\">\n          <div style=\"font-family:'Segoe UI', Helvetica, Arial, sans-serif; font-size:14px; line-height:1.6; color:var(--p-ink-2);\">Your document has been reviewed and approved by the PLX team.<\u002Fdiv>\n          <div class=\"mono\" style=\"font-size:10px; color:var(--p-muted); margin-top:4px;\">SANS · BODY · 'Segoe UI', Helvetica, Arial<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:10px 0; border-top:1px solid var(--p-grid-2);\">\n          <div style=\"font-family:'JetBrains Mono', Consolas, Menlo, monospace; font-size:13px; color:var(--p-ink);\">FM-2214 · PLX-TT-009 · 95 · 92 · 97<\u002Fdiv>\n          <div class=\"mono\" style=\"font-size:10px; color:var(--p-muted); margin-top:4px;\">MONO · LABELS &amp; DATA · JetBrains Mono, Consolas<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"meta\" style=\"margin:16px 0 10px;\">GEOMETRY<\u002Fdiv>\n        <div style=\"font-size:13px; display:flex; flex-direction:column; gap:6px; color:var(--p-ink-2);\">\n          <div>Card <strong>600px<\u002Fstrong>, hairline border, <strong>8px<\u002Fstrong> radius, no shadow.<\u002Fdiv>\n          <div>Buttons ink fill, mono caps, <strong>4px<\u002Fstrong> radius.<\u002Fdiv>\n          <div>Boxes 6px radius with a <strong>4px tone rule<\u002Fstrong>.<\u002Fdiv>\n          <div>No images, no icons, no emoji. The wordmark is a text chip.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Shell anatomy\" style=\"max-width:1280px; margin:0 auto; padding:52px 40px 0;\">\n    <div class=\"meta\" style=\"margin-bottom:10px;\">SECTION 03 · ANATOMY<\u002Fdiv>\n    <h2 style=\"font-size:26px;\">One shell, every send<\u002Fh2>\n    <p style=\"font-size:13px; max-width:70ch;\"><code>emailShell()<\u002Fcode> renders the frame below — table-based so Outlook keeps every background. Specimen: the welcome email (<code>welcomeEmail<\u002Fcode>, archetype 03).<\u002Fp>\n    <div class=\"hairline\" style=\"margin:14px 0 24px;\"><\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(560px, 100%), 1.5fr)); gap:32px; align-items:start;\">\n      <div style=\"background:#ECEFE9; border:1px solid var(--p-grid); border-radius:4px; padding:32px 24px; display:flex; justify-content:center;\">\n        <div style=\"width:600px; max-width:100%; background:#FBFAF6; border:1px solid #E4E0D6; border-radius:8px; overflow:hidden;\">\n          <div style=\"background:#1B1A17; padding:18px 24px; display:flex; align-items:center; gap:10px;\">\n            <span style=\"background:#FBFAF6; color:#1B1A17; font-family:'JetBrains Mono', Consolas, monospace; font-weight:700; font-size:13px; letter-spacing:0.04em; padding:4px 8px; border-radius:4px;\">PLX<\u002Fspan>\n            <span style=\"color:#FBFAF6; font-family:'Segoe UI', Helvetica, Arial, sans-serif; font-size:14px; font-weight:600; letter-spacing:0.02em;\">Customer Portal<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:26px 28px;\">\n            <div style=\"font-family:'JetBrains Mono', Consolas, monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:#6B665B; margin-bottom:8px;\">Account ready<\u002Fdiv>\n            <div style=\"font-family:Georgia, 'Times New Roman', serif; font-size:22px; line-height:1.3; color:#1B1A17; margin-bottom:14px;\">Welcome to your <em style=\"color:#244A39;\">portal<\u002Fem><\u002Fdiv>\n            <p style=\"margin:0 0 14px; font-family:'Segoe UI', Helvetica, Arial, sans-serif; font-size:14px; line-height:1.65; color:#3A3833;\">Hi Dana,<\u002Fp>\n            <p style=\"margin:0 0 14px; font-family:'Segoe UI', Helvetica, Arial, sans-serif; font-size:14px; line-height:1.65; color:#3A3833;\">Your PLX customer portal account has been created. Track orders, submit documents, and manage your projects in one place.<\u002Fp>\n            <div style=\"margin:16px 0; border:1px solid #E4E0D6; background:#ECEFE9; border-radius:6px; padding:14px 18px; display:grid; grid-template-columns:118px 1fr; gap:9px 16px; align-items:baseline;\">\n              <span style=\"font-family:'JetBrains Mono', Consolas, monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#6B665B;\">Email<\u002Fspan>\n              <span style=\"font-family:'Segoe UI', Helvetica, Arial, sans-serif; font-size:14px; color:#1B1A17;\">dana@meadowlark.co<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono', Consolas, monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#6B665B;\">Temp password<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono', Consolas, monospace; font-size:13px; color:#1B1A17;\">Xk4-mQ7-plx<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin:16px 0; padding:12px 16px; background:#FAF1DF; border-left:4px solid #C99340; border-radius:6px; font-family:'Segoe UI', Helvetica, Arial, sans-serif; font-size:13px; line-height:1.5; color:#3A3833;\">This temporary password expires in <strong>24 hours<\u002Fstrong>. You'll set a new one on first login.<\u002Fdiv>\n            <a href=\"#\" style=\"display:inline-block; background:#1B1A17; color:#FBFAF6; padding:11px 22px; border-radius:4px; font-family:'JetBrains Mono', Consolas, monospace; font-size:12px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; text-decoration:none; margin:6px 0 2px;\">Log in to your account<\u002Fa>\n            <div style=\"border-top:1px solid #EFEBE2; margin:24px 0 14px;\"><\u002Fdiv>\n            <p style=\"margin:0 0 18px; font-family:'Segoe UI', Helvetica, Arial, sans-serif; font-size:13px; line-height:1.6; color:#6B665B;\">Need help? Write to <a href=\"#\" style=\"color:#244A39; text-decoration:underline; text-underline-offset:2px;\">support@plxcustomer.io<\u002Fa> — it reaches your project manager.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#ECEFE9; border-top:1px solid #E4E0D6; padding:13px 28px; font-family:'JetBrains Mono', Consolas, monospace; font-size:10px; le r-top:1px solid var(--p-grid-2);\">Underlined-mono link strings as CTAs; mono as running body text.<\u002Fdiv>\n          <div style=\"padding:8px 0 0; border-top:1px solid var(--p-grid-2);\">Webfont-only stacks, <code>*-git-staging-*.vercel.app<\u002Fcode> URLs, unverified From domains.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Handoff\" style=\"max-width:1280px; margin:0 auto; padding:52px 40px 0;\">\n    <div class=\"meta\" style=\"margin-bottom:10px;\">SECTION 07 · HANDOFF<\u002Fdiv>\n    <h2 style=\"font-size:26px;\">Point the agent here<\u002Fh2>\n    <div class=\"hairline\" style=\"margin:14px 0 24px;\"><\u002Fdiv>\n    <div class=\"card\" style=\"padding:22px;\">\n      <div style=\"display:flex; flex-direction:column; font-size:13px;\">\n        <div style=\"display:grid; grid-template-columns:minmax(260px, 320px) 1fr; gap:16px; padding:10px 0; border-top:1px solid var(--p-grid-2); align-items:baseline;\"><span class=\"mono\" style=\"font-size:11px;\">repo-patch/EMAIL-STYLE-SOP.md<\u002Fspan><span style=\"color:var(--p-ink-2);\">Replaces <code>docs/design-system/EMAIL-STYLE-SOP.md<\u002Fcode> — v1.1: tokens unchanged (ADR-007 respected); adds the archetype taxonomy, Outlook-hardened shell rules, and scope for agent sends.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:minmax(260px, 320px) 1fr; gap:16px; padding:10px 0; border-top:1px solid var(--p-grid-2); align-items:baseline;\"><span class=\"mono\" style=\"font-size:11px;\">repo-patch/email-theme.ts<\u002Fspan><span style=\"color:var(--p-ink-2);\">Replaces <code>portal/src/lib/notifications/email-theme.ts<\u002Fcode> — same EMAIL tokens, table-based shell so Outlook keeps the ink header, new <code>emailKV<\u002Fcode> / <code>emailLink<\u002Fcode> / <code>emailDivider<\u002Fcode> helpers. Existing builders inherit the fix.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:minmax(260px, 320px) 1fr; gap:16px; padding:10px 0; border-top:1px solid var(--p-grid-2); align-items:baseline;\"><span class=\"mono\" style=\"font-size:11px;\">TOKENS<\u002Fspan><span style=\"color:var(--p-ink-2);\">No token changes required — <code>tokens.css<\u002Fcode> and <code>brand-tokens.css<\u002Fcode> stay exactly as they are; <code>cd portal &amp;&amp; npm run audit:tokens<\u002Fcode> keeps the email mirror honest.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"meta\" style=\"margin-top:32px;\">PLX DESIGN SYSTEM · EMAIL STANDARD PLX-EM-02 · EXTENDS EMAIL-STYLE-SOP V1.0 (2026-06-24) · PETRA LAB-X<\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showAudit&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showBefore&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showAudit: this.props.showAudit ?? true,\n      showBefore: this.props.showBefore ?? true,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
